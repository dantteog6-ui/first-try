<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 온라인 오목3</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #eac066;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #setup-box {
            background: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
        }
        input {
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1e1e24;
            color: #fff;
            outline: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background: #eac066;
            color: #1e1e24;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        button:hover { background: #f1cca3; }
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            background: #2a2a35;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        canvas {
            background: #dcb35c;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>1:1 온라인 오목</h1>

    <div id="setup-box">
        <p style="font-size: 0.95rem; color: #ccc;">2자리 방 코드를 입력하세요</p>
        <input type="text" id="roomCodeInput" placeholder="예: 12" maxlength="4" value="12">
        <div class="btn-group">
            <button onclick="startHosting()">방 만들기 (흑돌)</button>
            <button onclick="startJoining()" style="background: #a3c1ad;">방 들어가기 (백돌)</button>
        </div>
    </div>

    <div id="game-container">
        <div id="status">연결 중...</div>
        <canvas id="board" width="450" height="450"></canvas>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let board = Array(15).fill(null).map(() => Array(15).fill(0));
        let myTurn = false;
        let isMyColorBlack = false;
        let gameActive = false;

        const BOARD_SIZE = 15;
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const CELL_SIZE = canvas.width / BOARD_SIZE;

        // 방화벽 우회를 위한 STUN/TURN 서버 설정
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    {
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelay',
                        credential: 'openrelay'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelay',
                        credential: 'openrelay'
                    }
                ]
            }
        };

        // 1. 방 만들기 (호스트)
        function startHosting() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) { alert("코드를 입력해주세요!"); return; }

            showGameScreen();
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `[${code}]번 방 생성 중...`;

            const hostId = "omok-room-" + code;
            peer = new Peer(hostId, peerConfig);

            peer.on('open', () => {
                statusDiv.innerText = `[${code}]번 방 생성 완료! 상대방 입장을 기다리는 중...`;
                isMyColorBlack = true;
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("이미 사용 중인 방 번호입니다. 다른 번호를 입력해 주세요!");
                    location.reload();
                } else {
                    statusDiv.innerText = "오류 발생: " + err.type;
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                myTurn = true;
                gameActive = true;
                statusDiv.innerText = "상대방 입장 완료! 게임 시작 (당신은 흑돌)";
            });
        }

        // 2. 방 들어가기 (게스트)
        function startJoining() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) { alert("코드를 입력해주세요!"); return; }

            showGameScreen();
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `[${code}]번 방에 접속하는 중...`;

            peer = new Peer(peerConfig);
            const hostId = "omok-room-" + code;

            peer.on('open', () => {
                conn = peer.connect(hostId, { reliable: true });
                isMyColorBlack = false;
                setupConnection();
            });

            peer.on('error', (err) => {
                statusDiv.innerText = "접속 오류: " + err.type;
            });
        }

        function showGameScreen() {
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            drawBoard();
        }

        function setupConnection() {
            const statusDiv = document.getElementById('status');

            conn.on('open', () => {
                gameActive = true;
                if (!isMyColorBlack) {
                    statusDiv.innerText = "방 입장 성공! 상대방 턴 대기 중 (당신은 백돌)";
                    myTurn = false;
                }
                drawBoard();
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    board[data.y][data.x] = data.color;
                    drawBoard();
                    if (checkWin(data.x, data.y, data.color)) {
                        statusDiv.innerText = data.color === 1 ? "흑돌 승리!" : "백돌 승리!";
                        gameActive = false;
                        return;
                    }
                    myTurn = true;
                    statusDiv.innerText = "상대방이 두었습니다. 당신의 턴입니다!";
                }
            });

            conn.on('close', () => {
                statusDiv.innerText = "상대방과의 연결이 끊어졌습니다.";
                gameActive = false;
            });
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;

            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(CELL_SIZE / 2 + i * CELL_SIZE, CELL_SIZE / 2);
                ctx.lineTo(CELL_SIZE / 2 + i * CELL_SIZE, canvas.height - CELL_SIZE / 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
                ctx.lineTo(canvas.width - CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
                ctx.stroke();
            }

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] !== 0) {
                        ctx.beginPath();
                        ctx.arc(
                            CELL_SIZE / 2 + x * CELL_SIZE,
                            CELL_SIZE / 2 + y * CELL_SIZE,
                            CELL_SIZE * 0.4, 0, Math.PI * 2
                        );
                        ctx.fillStyle = board[y][x] === 1 ? '#000' : '#fff';
                        ctx.fill();
                        ctx.strokeStyle = '#333';
                        ctx.stroke();
                    }
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            if (!gameActive || !myTurn || !conn) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.round((e.clientX - rect.left - CELL_SIZE / 2) / CELL_SIZE);
            const y = Math.round((e.clientY - rect.top - CELL_SIZE / 2) / CELL_SIZE);

            if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return;
            if (board[y][x] !== 0) return;

            const myColor = isMyColorBlack ? 1 : 2;
            board[y][x] = myColor;
            drawBoard();

            conn.send({ type: 'move', x: x, y: y, color: myColor });

            if (checkWin(x, y, myColor)) {
                document.getElementById('status').innerText = "승리하셨습니다!";
                gameActive = false;
                return;
            }

            myTurn = false;
            document.getElementById('status').innerText = "상대방 턴입니다...";
        });

        function checkWin(x, y, color) {
            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dx, dy] of dirs) {
                let count = 1;
                for (let i = 1; i < 5; i++) {
                    let nx = x + dx * i, ny = y + dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE || board[ny][nx] !== color) break;
                    count++;
                }
                for (let i = 1; i < 5; i++) {
                    let nx = x - dx * i, ny = y - dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE || board[ny][nx] !== color) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }
    </script>
</body>
</html>
