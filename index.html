<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 온라인 오목 (2자리 코드)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #eac066;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #setup-box {
            background: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }
        input {
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1e1e24;
            color: #fff;
            outline: none;
        }
        button {
            background: #eac066;
            color: #1e1e24;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        button:hover { background: #f1cca3; }
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            background: #2a2a35;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        canvas {
            background: #dcb35c;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>1:1 온라인 오목</h1>

    <!-- 2자리 코드 입력 화면 -->
    <div id="setup-box">
        <p style="font-size: 0.95rem; color: #ccc;">사용할 2자리 방 코드를 입력하세요</p>
        <input type="text" id="roomCodeInput" placeholder="예: 12" maxlength="4" value="12">
        <button id="startBtn">방 만들기 / 들어가기</button>
    </div>

    <!-- 오목 게임 화면 -->
    <div id="game-container">
        <div id="status">연결 중...</div>
        <canvas id="board" width="450" height="450"></canvas>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let board = Array(15).fill(null).map(() => Array(15).fill(0));
        let myTurn = false;
        let isMyColorBlack = false;
        let gameActive = false;

        const BOARD_SIZE = 15;
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const CELL_SIZE = canvas.width / BOARD_SIZE;

        document.getElementById('startBtn').addEventListener('click', joinGame);

        function joinGame() {
            const codeInput = document.getElementById('roomCodeInput');
            const code = codeInput.value.trim();
            if (!code) {
                alert("2자리 코드를 입력해주세요!");
                return;
            }

            // 입력창 숨기고 게임판 보이기
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            drawBoard();

            const statusDiv = document.getElementById('status');
            const hostId = "omok-room-" + code;

            // 방 생성 시도 (호스트)
            peer = new Peer(hostId);

            peer.on('open', (id) => {
                statusDiv.innerText = `[${code}]번 방 생성 완료! 상대방 접속을 기다리는 중...`;
                isMyColorBlack = true; // 먼저 방 만든 사람이 흑돌
            });

            // 이미 방이 만들어진 코드인 경우 (게스트로 연결)
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    statusDiv.innerText = `[${code}]번 방에 접속하는 중...`;
                    
                    // 게스트용 임의 Peer 생성 후 호스트에 연결
                    peer = new Peer();
                    peer.on('open', () => {
                        conn = peer.connect(hostId);
                        isMyColorBlack = false; // 게스트는 백돌
                        setupConnection();
                    });
                } else {
                    statusDiv.innerText = "연결 오류 발생: " + err.type;
                }
            });

            // 상대방이 내 방으로 들어왔을 때 (호스트 시점)
            peer.on('connection', (connection) => {
                conn = connection;
                myTurn = true; // 흑돌 선공
                gameActive = true;
                setupConnection();
                statusDiv.innerText = "상대방과 연결되었습니다! 당신의 턴입니다 (흑돌)";
            });
        }

        function setupConnection() {
            const statusDiv = document.getElementById('status');

            conn.on('open', () => {
                gameActive = true;
                if (!isMyColorBlack) {
                    statusDiv.innerText = "방 입장 완료! 상대방 턴을 기다리는 중 (백돌)";
                    myTurn = false;
                }
                drawBoard();
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    board[data.y][data.x] = data.color;
                    drawBoard();
                    if (checkWin(data.x, data.y, data.color)) {
                        statusDiv.innerText = data.color === 1 ? "흑돌 승리!" : "백돌 승리!";
                        gameActive = false;
                        return;
                    }
                    myTurn = true;
                    statusDiv.innerText = "상대방이 두었습니다. 당신의 턴입니다!";
                }
            });

            conn.on('close', () => {
                statusDiv.innerText = "상대방과의 연결이 끊어졌습니다.";
                gameActive = false;
            });
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;

            // 격자 그리기
            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(CELL_SIZE / 2 + i * CELL_SIZE, CELL_SIZE / 2);
                ctx.lineTo(CELL_SIZE / 2 + i * CELL_SIZE, canvas.height - CELL_SIZE / 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
                ctx.lineTo(canvas.width - CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
                ctx.stroke();
            }

            // 돌 그리기
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] !== 0) {
                        ctx.beginPath();
                        ctx.arc(
                            CELL_SIZE / 2 + x * CELL_SIZE,
                            CELL_SIZE / 2 + y * CELL_SIZE,
                            CELL_SIZE * 0.4, 0, Math.PI * 2
                        );
                        ctx.fillStyle = board[y][x] === 1 ? '#000' : '#fff';
                        ctx.fill();
                        ctx.strokeStyle = '#333';
                        ctx.stroke();
                    }
                }
            }
        }

        // 클릭하여 돌 놓기
        canvas.addEventListener('click', (e) => {
            if (!gameActive || !myTurn || !conn) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.round((e.clientX - rect.left - CELL_SIZE / 2) / CELL_SIZE);
            const y = Math.round((e.clientY - rect.top - CELL_SIZE / 2) / CELL_SIZE);

            if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return;
            if (board[y][x] !== 0) return;

            const myColor = isMyColorBlack ? 1 : 2;
            board[y][x] = myColor;
            drawBoard();

            conn.send({ type: 'move', x: x, y: y, color: myColor });

            if (checkWin(x, y, myColor)) {
                document.getElementById('status').innerText = "승리하셨습니다!";
                gameActive = false;
                return;
            }

            myTurn = false;
            document.getElementById('status').innerText = "상대방 턴입니다...";
        });

        function checkWin(x, y, color) {
            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dx, dy] of dirs) {
                let count = 1;
                for (let i = 1; i < 5; i++) {
                    let nx = x + dx * i, ny = y + dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE || board[ny][nx] !== color) break;
                    count++;
                }
                for (let i = 1; i < 5; i++) {
                    let nx = x - dx * i, ny = y - dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE || board[ny][nx] !== color) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }
    </script>
</body>
</html>
