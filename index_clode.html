<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 온라인 오목</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: #eac066; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #setup-box {
            background: #2a2a35; padding: 30px; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); text-align: center;
            display: flex; flex-direction: column; gap: 15px;
            width: 100%; max-width: 340px;
        }
        input {
            padding: 12px; font-size: 1.2rem; text-align: center; border-radius: 6px;
            border: 1px solid #444; background: #1e1e24; color: #fff; outline: none;
        }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; background: #eac066; color: #1e1e24; border: none; padding: 12px;
            font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.2s;
        }
        button:hover { background: #f1cca3; }
        #game-container { display: none; flex-direction: column; align-items: center; width: 100%; }
        #status {
            font-size: 1.05rem; margin-bottom: 8px; background: #2a2a35;
            padding: 8px 16px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-align: center; max-width: 480px;
        }
        #debug { font-size: 0.8rem; color: #888; margin-bottom: 12px; min-height: 1em; text-align: center; }
        canvas {
            background: #dcb35c; box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            cursor: pointer; border-radius: 4px;
            width: 100%; max-width: 450px; height: auto; touch-action: manipulation;
        }
        #back-btn { margin-top: 16px; flex: none; background: #555; color: #fff; padding: 10px 20px; }
    </style>
</head>
<body>

    <h1>1:1 온라인 오목</h1>

    <div id="setup-box">
        <p style="font-size: 0.95rem; color: #ccc;">방 코드를 입력하세요 (영문/숫자)</p>
        <input type="text" id="roomCodeInput" placeholder="예: 12" maxlength="8" value="12">
        <div class="btn-group">
            <button onclick="startHosting()">방 만들기 (흑돌)</button>
            <button onclick="startJoining()" style="background: #a3c1ad;">방 들어가기 (백돌)</button>
        </div>
    </div>

    <div id="game-container">
        <div id="status">연결 중...</div>
        <div id="debug"></div>
        <canvas id="board" width="450" height="450"></canvas>
        <button id="back-btn" onclick="location.reload()">처음으로</button>
    </div>

    <script>
        // ===== TURN 서버 설정 =====
        // 아래 공개 TURN이 안 되면 metered.ca 등에서 본인 계정을 발급받아 교체하세요.
        const peerConfig = {
            debug: 1,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        };

        const BOARD_SIZE = 15;
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const CELL_SIZE = canvas.width / BOARD_SIZE;
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');

        let peer = null;
        let conn = null;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let myTurn = false;
        let isMyColorBlack = false;
        let gameActive = false;
        let joinTimer = null;

        function setStatus(t) { statusDiv.innerText = t; }
        function setDebug(t) { debugDiv.innerText = t; }

        function getRoomCode() {
            const code = document.getElementById('roomCodeInput').value.trim().toLowerCase();
            if (!code) { alert("코드를 입력해주세요!"); return null; }
            if (!/^[a-z0-9]+$/.test(code)) { alert("영문/숫자만 사용해주세요!"); return null; }
            return code;
        }

        function showGameScreen() {
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            drawBoard();
        }

        // ===== 1. 방 만들기 (호스트) =====
        function startHosting() {
            const code = getRoomCode();
            if (!code) return;

            showGameScreen();
            setStatus(`[${code}]번 방 생성 중...`);
            isMyColorBlack = true;

            peer = new Peer("omok-room-" + code, peerConfig);

            peer.on('open', () => {
                setStatus(`[${code}]번 방 생성 완료! 상대방 입장을 기다리는 중...`);
            });

            peer.on('disconnected', () => {
                // 시그널링 서버와 끊기면 재연결 (방 번호 유지)
                setDebug("서버 연결 끊김, 재연결 시도 중...");
                if (peer && !peer.destroyed) peer.reconnect();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("이미 사용 중인 방 번호입니다. 다른 번호를 입력해 주세요!");
                    location.reload();
                } else {
                    setStatus("오류 발생: " + err.type);
                }
            });

            peer.on('connection', (connection) => {
                if (conn && conn.open) {   // 이미 상대가 있으면 거절
                    connection.on('open', () => connection.close());
                    return;
                }
                conn = connection;
                setupConnection();
            });
        }

        // ===== 2. 방 들어가기 (게스트) =====
        function startJoining() {
            const code = getRoomCode();
            if (!code) return;

            showGameScreen();
            setStatus(`[${code}]번 방에 접속하는 중...`);
            isMyColorBlack = false;

            peer = new Peer(peerConfig);

            peer.on('open', () => {
                conn = peer.connect("omok-room-" + code, { reliable: true });
                setupConnection();

                // 20초 안에 연결 안 되면 안내
                joinTimer = setTimeout(() => {
                    if (!gameActive) {
                        setStatus("연결 시간 초과. 방 번호가 맞는지, 방장이 방을 만들었는지 확인하세요.");
                        setDebug("그래도 안 되면 네트워크(TURN) 문제일 수 있어요. 같은 와이파이로 테스트해보세요.");
                    }
                }, 20000);
            });

            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    setStatus("해당 번호의 방이 없습니다. 방장이 먼저 방을 만들어야 해요.");
                } else {
                    setStatus("접속 오류: " + err.type);
                }
            });
        }

        // ===== 연결 공통 처리 =====
        function setupConnection() {
            // ICE 연결 상태를 화면에 표시 (원인 파악용)
            const pc = conn.peerConnection;
            if (pc) {
                pc.addEventListener('iceconnectionstatechange', () => {
                    setDebug("연결 상태: " + pc.iceConnectionState);
                });
            }

            conn.on('open', () => {
                clearTimeout(joinTimer);
                gameActive = true;
                if (isMyColorBlack) {
                    myTurn = true;
                    setStatus("상대방 입장 완료! 게임 시작 (당신은 흑돌, 먼저 두세요)");
                } else {
                    myTurn = false;
                    setStatus("방 입장 성공! 상대방 턴 대기 중 (당신은 백돌)");
                }
                setDebug("");
                drawBoard();
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    if (board[data.y] === undefined || board[data.y][data.x] !== 0) return;
                    board[data.y][data.x] = data.color;
                    drawBoard();
                    if (checkWin(data.x, data.y, data.color)) {
                        setStatus(data.color === 1 ? "흑돌 승리!" : "백돌 승리!");
                        gameActive = false;
                        return;
                    }
                    myTurn = true;
                    setStatus("상대방이 두었습니다. 당신의 턴입니다!");
                }
            });

            conn.on('close', () => {
                if (gameActive) setStatus("상대방과의 연결이 끊어졌습니다.");
                gameActive = false;
            });

            conn.on('error', (e) => {
                setStatus("연결 오류: " + (e.type || e));
            });
        }

        // ===== 그리기 =====
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;

            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(CELL_SIZE / 2 + i * CELL_SIZE, CELL_SIZE / 2);
                ctx.lineTo(CELL_SIZE / 2 + i * CELL_SIZE, canvas.height - CELL_SIZE / 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
                ctx.lineTo(canvas.width - CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
                ctx.stroke();
            }

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] !== 0) {
                        ctx.beginPath();
                        ctx.arc(CELL_SIZE / 2 + x * CELL_SIZE, CELL_SIZE / 2 + y * CELL_SIZE, CELL_SIZE * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = board[y][x] === 1 ? '#000' : '#fff';
                        ctx.fill();
                        ctx.strokeStyle = '#333';
                        ctx.stroke();
                    }
                }
            }
        }

        // ===== 클릭(착수) =====
        canvas.addEventListener('click', (e) => {
            if (!gameActive || !myTurn || !conn || !conn.open) return;

            // 화면에 캔버스가 축소 표시돼도 좌표가 맞도록 보정
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const px = (e.clientX - rect.left) * scale;
            const py = (e.clientY - rect.top) * scale;
            const x = Math.round((px - CELL_SIZE / 2) / CELL_SIZE);
            const y = Math.round((py - CELL_SIZE / 2) / CELL_SIZE);

            if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return;
            if (board[y][x] !== 0) return;

            const myColor = isMyColorBlack ? 1 : 2;
            board[y][x] = myColor;
            drawBoard();

            conn.send({ type: 'move', x: x, y: y, color: myColor });

            if (checkWin(x, y, myColor)) {
                setStatus("승리하셨습니다!");
                gameActive = false;
                return;
            }

            myTurn = false;
            setStatus("상대방 턴입니다...");
        });

        function checkWin(x, y, color) {
            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dx, dy] of dirs) {
                let count = 1;
                for (let i = 1; i < 5; i++) {
                    let nx = x + dx * i, ny = y + dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE || board[ny][nx] !== color) break;
                    count++;
                }
                for (let i = 1; i < 5; i++) {
                    let nx = x - dx * i, ny = y - dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE || board[ny][nx] !== color) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }
    </script>
</body>
</html>
